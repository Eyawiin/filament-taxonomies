providers:
  - Eyawiin\FilamentTaxonomies\FilamentTaxonomiesServiceProvider
  - Workbench\App\Providers\WorkbenchServiceProvider
  - Workbench\App\Providers\Filament\AdminPanelProvider

migrations:
  - database/migrations
  - workbench/database/migrations

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

workbench:
  start: '/admin'
  user: test@example.com
  install: true
  health: false
  discovers:
    web: true
    api: true
    commands: true
    components: false
    factories: true
    views: false
  build:
    - asset-publish
    - filament:assets
    - migrate
    - db:seed:
        --class: Workbench\Database\Seeders\DatabaseSeeder
  assets:
    - laravel-assets
