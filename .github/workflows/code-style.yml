name: code-style

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  code-style:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject paths that differ only by letter case
        run: |
          collisions="$(git ls-files | awk -F/ '{p=""; for (i=1;i<=NF;i++){p=(i==1?$i:p"/"$i); print p}}' | sort -u | sort -f | uniq -di)"
          if [ -n "$collisions" ]; then
            echo "::error::These paths collide on case-insensitive filesystems (macOS, Windows):"
            echo "$collisions"
            exit 1
          fi

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.composer/cache/files
          key: composer-cs-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-cs-

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: 8.4

      - name: Install dependencies
        run: composer install --no-interaction --no-scripts

      - name: Check Pint
        run: ./vendor/bin/pint --test
