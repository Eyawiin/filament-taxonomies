name: mysql

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hierarchy-contract:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: taxonomy-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptaxonomy-ci-only"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          extensions: intl, pdo_mysql
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - name: Verify actual InnoDB contention and constraints
        run: composer test:concurrency
        env:
          TAXONOMY_MYSQL_HOST: 127.0.0.1
          TAXONOMY_MYSQL_PORT: 3306
          TAXONOMY_MYSQL_USER: root
          TAXONOMY_MYSQL_PASSWORD: taxonomy-ci-only
